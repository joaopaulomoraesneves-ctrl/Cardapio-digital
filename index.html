<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delícia Digital - Cardápio Profissional</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { colors: { premium: { dark: '#121212', gray: '#1E1E1E', gold: '#D4AF37' } } } } }
    </script>
    <style>
        body { background-color: #121212; color: #F8F8F8; }
        .modal-enter { opacity: 0; transform: scale(0.95); }
        .modal-enter-active { opacity: 1; transform: scale(1); transition: all 0.3s ease-out; }
        .toast { animation: slideIn 0.3s ease-out, fadeOut 0.5s 2.5s forwards; }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }
        .filter-btn.active { background-color: #D4AF37; color: #121212; }
        .invalid-field { border-color: #EF4444 !important; }
    </style>
</head>
<body class="font-sans pb-24">

    <!-- Banner de Fora do Horário -->
    <div id="horario-banner" class="bg-red-600 text-white text-center py-2 font-semibold hidden">
        🕒 Estamos fechados no momento. Você pode montar seu pedido, mas a finalização estará disponível durante o horário de funcionamento.
    </div>

    <!-- Header -->
    <header class="sticky top-0 z-30 bg-premium-dark/90 backdrop-blur-md border-b border-gray-800">
        <div class="max-w-6xl mx-auto px-4 py-3 flex flex-col md:flex-row md:items-center gap-3">
            <div class="flex justify-between items-center w-full md:w-auto">
                <h1 class="text-2xl md:text-3xl font-serif text-premium-gold tracking-wider">DELÍCIA DIGITAL</h1>
                <button id="btn-carrinho-mobile" class="relative p-2 text-premium-gold hover:text-white transition md:hidden" aria-label="Abrir carrinho">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 100 4 2 2 0 000-4z" />
                    </svg>
                    <span id="carrinho-badge-mobile" class="absolute -top-1 -right-1 bg-red-600 text-white text-xs rounded-full h-5 w-5 items-center justify-center hidden">0</span>
                </button>
            </div>
            <div class="flex-1 max-w-md mx-auto md:ml-4">
                <input type="text" id="busca" placeholder="🔍 Buscar prato..." class="w-full px-4 py-2 rounded-full bg-premium-gray border border-gray-700 text-white placeholder-gray-400 focus:outline-none focus:border-premium-gold">
            </div>
            <button id="btn-carrinho-desktop" class="hidden md:flex relative p-2 text-premium-gold hover:text-white transition" aria-label="Abrir carrinho">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 100 4 2 2 0 000-4z" />
                </svg>
                <span id="carrinho-badge-desktop" class="absolute -top-1 -right-1 bg-red-600 text-white text-xs rounded-full h-5 w-5 items-center justify-center hidden">0</span>
            </button>
        </div>
        <div class="max-w-6xl mx-auto px-4 pb-3 flex gap-2 overflow-x-auto hide-scrollbar" id="filtros-container"></div>
    </header>

    <!-- Toast Notification -->
    <div id="toast" class="fixed top-20 right-4 z-50 bg-green-600 text-white px-4 py-3 rounded-lg shadow-lg opacity-0 pointer-events-none transition-opacity"></div>

    <!-- Grid de produtos -->
    <main id="produtos-container" class="px-6 grid gap-6 md:grid-cols-2 lg:grid-cols-3 max-w-6xl mx-auto pt-6"></main>

    <!-- Footer fixo do carrinho -->
    <div id="cart-footer" class="fixed bottom-0 left-0 w-full bg-premium-gray/95 backdrop-blur-sm border-t border-premium-gold p-4 hidden">
        <button id="btn-abrir-carrinho-footer" class="w-full bg-premium-dark hover:bg-gray-800 py-4 rounded-xl font-bold text-white shadow-lg flex justify-between items-center px-6 border border-premium-gold transition">
            <span>🛒 Carrinho</span>
            <span id="footer-total">R$ 0,00</span>
        </button>
    </div>

    <!-- Modal de Confirmação -->
    <div id="modal-confirmacao" class="fixed inset-0 z-50 flex items-center justify-center p-4 hidden">
        <div class="absolute inset-0 bg-black/60 backdrop-blur-sm"></div>
        <div class="relative bg-premium-gray rounded-2xl w-full max-w-sm p-6 border border-gray-700 shadow-2xl modal-enter">
            <p id="confirmacao-mensagem" class="text-white text-lg mb-6"></p>
            <div class="flex justify-end gap-3">
                <button id="confirmacao-cancelar" class="px-4 py-2 bg-gray-700 hover:bg-gray-600 text-white rounded-lg transition">Cancelar</button>
                <button id="confirmacao-ok" class="px-4 py-2 bg-premium-gold text-premium-dark rounded-lg font-bold hover:bg-yellow-500 transition">Confirmar</button>
            </div>
        </div>
    </div>

    <!-- Modal do Carrinho -->
    <div id="modal-carrinho" class="fixed inset-0 z-40 flex items-center justify-center p-4 hidden">
        <div class="absolute inset-0 bg-black/60 backdrop-blur-sm"></div>
        <div id="modal-content-carrinho" class="relative bg-premium-gray rounded-2xl w-full max-w-lg p-6 border border-gray-700 shadow-2xl modal-enter max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-serif text-premium-gold">Seu Carrinho</h2>
                <button id="btn-fechar-carrinho" class="text-gray-400 hover:text-white p-1" aria-label="Fechar carrinho">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
            <div id="itens-carrinho" class="space-y-4 max-h-64 overflow-y-auto mb-6"></div>
            <div id="checkout-form" class="border-t border-gray-700 pt-4 space-y-3 hidden">
                <h3 class="text-lg font-semibold text-premium-gold">Dados para Entrega</h3>
                <input type="text" id="nome-cliente" placeholder="Seu nome" class="w-full px-3 py-2 rounded bg-premium-dark border border-gray-700 text-white">
                <input type="tel" id="telefone-cliente" placeholder="WhatsApp (com DDD)" class="w-full px-3 py-2 rounded bg-premium-dark border border-gray-700 text-white">
                <div class="flex gap-2">
                    <label class="flex items-center gap-2"><input type="radio" name="tipo-entrega" value="retirada" checked> Retirar no local</label>
                    <label class="flex items-center gap-2"><input type="radio" name="tipo-entrega" value="entrega"> Entrega</label>
                </div>
                <input type="text" id="endereco" placeholder="Endereço completo (se entrega)" class="w-full px-3 py-2 rounded bg-premium-dark border border-gray-700 text-white hidden">
                <select id="bairro" class="w-full px-3 py-2 rounded bg-premium-dark border border-gray-700 text-white hidden">
                    <option value="">Selecione o bairro</option>
                </select>
                <select id="forma-pagamento" class="w-full px-3 py-2 rounded bg-premium-dark border border-gray-700 text-white">
                    <option value="">Forma de pagamento</option>
                    <option value="Pix">Pix</option>
                    <option value="Cartão">Cartão</option>
                    <option value="Dinheiro">Dinheiro</option>
                </select>
                <div id="troco-container" class="hidden">
                    <input type="number" id="troco" min="0" step="0.01" placeholder="Troco para quanto?" class="w-full px-3 py-2 rounded bg-premium-dark border border-gray-700 text-white">
                </div>
                <div class="space-y-2">
                    <label class="text-sm text-gray-400">Observações gerais do pedido</label>
                    <textarea id="observacao-geral" rows="2" placeholder="Ex: entregar no portão, bebê dormindo..." class="w-full px-3 py-2 rounded bg-premium-dark border border-gray-700 text-white"></textarea>
                </div>
                <p class="text-sm text-gray-400">Taxa de entrega: <span id="taxa-entrega-valor">R$ 0,00</span></p>
                <p class="text-sm text-gray-400">Tempo estimado: <span id="tempo-estimado">40 a 60 minutos</span></p>
                <div class="flex justify-between text-lg font-bold pt-2 border-t border-gray-700">
                    <span>Total final</span>
                    <span id="modal-total-final" class="text-premium-gold">R$ 0,00</span>
                </div>
            </div>
            <button id="btn-finalizar" class="w-full mt-6 bg-green-600 hover:bg-green-700 py-3 rounded-xl font-bold text-white transition flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed hidden">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
                </svg>
                Finalizar Pedido no WhatsApp
            </button>
            <button id="btn-esvaziar-carrinho" class="w-full mt-2 bg-red-600 hover:bg-red-700 py-2 rounded-xl font-bold text-white transition hidden">Esvaziar Carrinho</button>
        </div>
    </div>

    <!-- Modal de Detalhes do Produto -->
    <div id="modal-detalhes" class="fixed inset-0 z-40 flex items-center justify-center p-4 hidden">
        <div class="absolute inset-0 bg-black/60 backdrop-blur-sm"></div>
        <div id="modal-content-detalhes" class="relative bg-premium-gray rounded-2xl w-full max-w-md p-6 border border-gray-700 shadow-2xl modal-enter">
            <button id="btn-fechar-detalhes" class="absolute top-3 right-3 text-gray-400 hover:text-white p-1" aria-label="Fechar detalhes">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
            <img id="detalhe-img" src="" alt="" class="w-full h-48 object-cover rounded-lg mb-4" loading="lazy">
            <h2 id="detalhe-nome" class="text-2xl font-serif text-premium-gold mb-2"></h2>
            <p id="detalhe-descricao" class="text-gray-400 mb-4"></p>
            <div id="detalhe-opcoes" class="space-y-3 mb-4"></div>
            <div class="flex justify-between items-center pt-4 border-t border-gray-700">
                <span id="detalhe-preco" class="text-xl font-bold text-premium-gold"></span>
                <button id="btn-adicionar-detalhe" class="px-6 py-2 bg-premium-gold text-premium-dark rounded-lg font-bold hover:bg-yellow-500 transition disabled:opacity-50 disabled:cursor-not-allowed">Adicionar</button>
            </div>
        </div>
    </div>

    <script>
        (function() {
            // ==================== CONFIGURAÇÕES ====================
            const WHATSAPP_NUMBER = "5527996624547";
            const HORARIO_ABERTURA = 11;
            const HORARIO_FECHAMENTO = 22;
            const PEDIDO_MINIMO = 25.00;
            const TEMPO_ENTREGA = "40 a 60 minutos";
            const TAXA_ENTREGA_PADRAO = 8.00;
            
            const BAIRROS = [
                { nome: "Centro", taxa: 5.00 },
                { nome: "Jardim América", taxa: 8.00 },
                { nome: "Zona Rural", taxa: 15.00 }
            ];

            const produtos = [
                { id: 1, nome: "Bife Ancho Premium", categoria: "Carnes", preco: 89.00, imagem: "https://images.unsplash.com/photo-1544025162-8356a698a964?auto=format&fit=crop&q=80&w=600", descricao: "Bife ancho grelhado no ponto exato, servido com risoto cremoso de cogumelos frescos.", extras: [
                    { nome: "Ponto da carne", tipo: "radio", opcoes: [{ nome: "Mal passado", preco: 0 }, { nome: "Ao ponto", preco: 0 }, { nome: "Bem passado", preco: 0 }] },
                    { nome: "Molho extra", tipo: "checkbox", opcoes: [{ nome: "Molho de pimenta", preco: 5 }] }
                ]},
                { id: 2, nome: "Salmão ao Maracujá", categoria: "Carnes", preco: 75.00, imagem: "https://images.unsplash.com/photo-1551183053-bf91a1d81141?auto=format&fit=crop&q=80&w=600", descricao: "Filé de salmão com crosta de gergelim e redução de maracujá.", extras: [
                    { nome: "Acompanhamento extra", tipo: "checkbox", opcoes: [{ nome: "Purê de batata", preco: 8 }] }
                ]},
                { id: 3, nome: "Risoto de Camarão", categoria: "Massas", preco: 62.00, imagem: "https://images.unsplash.com/photo-1604908176997-125f25cc6f3d?auto=format&fit=crop&q=80&w=600", descricao: "Risoto cremoso de camarões ao perfume de açafrão.", extras: [] },
                { id: 4, nome: "Penne ao Pesto", categoria: "Massas", preco: 45.00, imagem: "https://images.unsplash.com/photo-1586190848861-99aa4a171e90?auto=format&fit=crop&q=80&w=600", descricao: "Penne artesanal com pesto genovês e tomate cereja.", extras: [
                    { nome: "Proteína extra", tipo: "checkbox", opcoes: [{ nome: "Frango grelhado", preco: 10 }, { nome: "Camarão", preco: 15 }] }
                ]},
                { id: 5, nome: "Suco Detox", categoria: "Bebidas", preco: 18.00, imagem: "https://images.unsplash.com/photo-1622597467836-f3285f2131b7?auto=format&fit=crop&q=80&w=600", descricao: "Suco verde refrescante com couve, maçã e gengibre.", extras: [] },
                { id: 6, nome: "Mousse de Chocolate", categoria: "Sobremesas", preco: 28.00, imagem: "https://images.unsplash.com/photo-1541783245831-57d6fb0926d3?auto=format&fit=crop&q=80&w=600", descricao: "Mousse belga com raspas de chocolate 70% cacau.", extras: [
                    { nome: "Cobertura", tipo: "checkbox", opcoes: [{ nome: "Doce de leite", preco: 4 }, { nome: "Frutas vermelhas", preco: 6 }] }
                ]}
            ];

            let carrinho = [];
            let categoriaAtiva = "Todas";
            let produtoDetalheAtual = null;
            let horarioAnterior = null;

            function formatarMoeda(valor) {
                return valor.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
            }

            function dentroDoHorario() {
                const agora = new Date();
                const hora = agora.getHours();
                return hora >= HORARIO_ABERTURA && hora < HORARIO_FECHAMENTO;
            }

            function escaparHTML(str) {
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            }

            function mostrarConfirmacao(mensagem, callback) {
                document.getElementById('confirmacao-mensagem').textContent = mensagem;
                document.getElementById('modal-confirmacao').classList.remove('hidden');
                const btnOk = document.getElementById('confirmacao-ok');
                const btnCancelar = document.getElementById('confirmacao-cancelar');
                function limpar() {
                    document.getElementById('modal-confirmacao').classList.add('hidden');
                    btnOk.removeEventListener('click', onOk);
                    btnCancelar.removeEventListener('click', onCancel);
                }
                function onOk() {
                    limpar();
                    if (callback) callback(true);
                }
                function onCancel() {
                    limpar();
                    if (callback) callback(false);
                }
                btnOk.addEventListener('click', onOk);
                btnCancelar.addEventListener('click', onCancel);
            }

            function salvarCarrinho() {
                localStorage.setItem('carrinhoDelicia', JSON.stringify(carrinho));
                atualizarInterface();
            }

            function migrarCarrinhoAntigo(itens) {
                return itens.filter(item => {
                    if (item.produtoId && item.nome) return true;
                    if (item.produto && item.produto.id) return true;
                    return false;
                }).map(item => {
                    if (item.produtoId) return item;
                    return {
                        produtoId: item.produto.id,
                        nome: item.produto.nome,
                        precoUnitario: item.precoUnitario || item.produto.preco,
                        quantidade: item.quantidade || 1,
                        extras: item.extras || [],
                        observacao: item.observacao || ""
                    };
                });
            }

            function carregarCarrinho() {
                try {
                    const saved = localStorage.getItem('carrinhoDelicia');
                    if (saved) {
                        const itens = JSON.parse(saved);
                        if (Array.isArray(itens)) {
                            carrinho = migrarCarrinhoAntigo(itens);
                            if (carrinho.length !== itens.length) {
                                mostrarToast("Alguns itens do carrinho anterior foram atualizados.");
                            }
                        } else {
                            carrinho = [];
                        }
                    } else {
                        carrinho = [];
                    }
                } catch {
                    carrinho = [];
                    localStorage.removeItem('carrinhoDelicia');
                }
            }

            function adicionarAoCarrinho(produto, extrasSelecionadosNomes, precoAdicional) {
                if (!dentroDoHorario()) {
                    mostrarToast("Fora do horário de funcionamento.");
                    return;
                }
                const precoFinal = produto.preco + (precoAdicional || 0);
                const itemExistente = carrinho.find(item =>
                    item.produtoId === produto.id &&
                    JSON.stringify(item.extras) === JSON.stringify(extrasSelecionadosNomes || []) &&
                    item.observacao === ""
                );
                if (itemExistente) {
                    itemExistente.quantidade++;
                } else {
                    carrinho.push({
                        produtoId: produto.id,
                        nome: produto.nome,
                        precoUnitario: precoFinal,
                        quantidade: 1,
                        extras: extrasSelecionadosNomes || [],
                        observacao: ""
                    });
                }
                salvarCarrinho();
                mostrarToast(`${produto.nome} adicionado!`);
            }

            function removerDoCarrinho(index) {
                mostrarConfirmacao(`Remover ${carrinho[index].nome} do carrinho?`, (confirmado) => {
                    if (confirmado) {
                        carrinho.splice(index, 1);
                        salvarCarrinho();
                        if (carrinho.length === 0) fecharCarrinho();
                    }
                });
            }

            function alterarQuantidade(index, delta) {
                carrinho[index].quantidade += delta;
                if (carrinho[index].quantidade <= 0) {
                    removerDoCarrinho(index);
                } else {
                    salvarCarrinho();
                }
            }

            function atualizarObservacao(index, texto) {
                carrinho[index].observacao = texto;
                salvarCarrinho();
            }

            function esvaziarCarrinho() {
                mostrarConfirmacao("Tem certeza que deseja esvaziar o carrinho?", (confirmado) => {
                    if (confirmado) {
                        carrinho = [];
                        salvarCarrinho();
                        fecharCarrinho();
                    }
                });
            }

            function atualizarBadges(quantidadeTotal) {
                const mobile = document.getElementById('carrinho-badge-mobile');
                const desktop = document.getElementById('carrinho-badge-desktop');
                mobile.textContent = quantidadeTotal;
                desktop.textContent = quantidadeTotal;
                const mostrar = quantidadeTotal > 0;
                mobile.classList.toggle('hidden', !mostrar);
                mobile.classList.toggle('flex', mostrar);
                desktop.classList.toggle('hidden', !mostrar);
                desktop.classList.toggle('flex', mostrar);
            }

            function atualizarInterface() {
                const quantidadeTotal = carrinho.reduce((acc, item) => acc + item.quantidade, 0);
                const totalItens = carrinho.reduce((acc, item) => acc + (item.precoUnitario * item.quantidade), 0);
                
                atualizarBadges(quantidadeTotal);
                
                const footer = document.getElementById('cart-footer');
                if (quantidadeTotal > 0) {
                    footer.classList.remove('hidden');
                    document.getElementById('footer-total').textContent = formatarMoeda(totalItens);
                } else {
                    footer.classList.add('hidden');
                }
                
                if (!document.getElementById('modal-carrinho').classList.contains('hidden')) {
                    renderizarItensCarrinho();
                }
            }

            function renderizarItensCarrinho() {
                const container = document.getElementById('itens-carrinho');
                const form = document.getElementById('checkout-form');
                const btnFinalizar = document.getElementById('btn-finalizar');
                const btnEsvaziar = document.getElementById('btn-esvaziar-carrinho');
                
                if (carrinho.length === 0) {
                    container.innerHTML = `<div class="text-center py-8"><span class="text-6xl">🛒</span><p class="text-gray-400 mt-2">Seu carrinho está vazio.</p></div>`;
                    form.classList.add('hidden');
                    btnFinalizar.classList.add('hidden');
                    btnEsvaziar.classList.add('hidden');
                    return;
                }
                
                form.classList.remove('hidden');
                btnFinalizar.classList.remove('hidden');
                btnEsvaziar.classList.remove('hidden');
                
                let html = '';
                let totalItens = 0;
                carrinho.forEach((item, index) => {
                    const subtotal = item.precoUnitario * item.quantidade;
                    totalItens += subtotal;
                    html += `
                        <div class="bg-premium-dark/50 p-3 rounded-lg space-y-2">
                            <div class="flex justify-between items-start">
                                <div>
                                    <h3 class="font-medium">${escaparHTML(item.nome)}</h3>
                                    ${item.extras.length > 0 ? `<p class="text-xs text-gray-400">${item.extras.map(e => escaparHTML(e)).join(', ')}</p>` : ''}
                                    <p class="text-sm text-gray-400">${formatarMoeda(item.precoUnitario)} cada</p>
                                </div>
                                <button class="btn-remover-item text-red-400 hover:text-red-300 p-1" data-index="${index}" aria-label="Remover ${escaparHTML(item.nome)}">🗑️</button>
                            </div>
                            <div class="flex items-center gap-2">
                                <button class="btn-alterar-qtd w-7 h-7 rounded-full bg-gray-700 hover:bg-gray-600 flex items-center justify-center" data-index="${index}" data-delta="-1">-</button>
                                <span class="w-8 text-center font-bold">${item.quantidade}</span>
                                <button class="btn-alterar-qtd w-7 h-7 rounded-full bg-gray-700 hover:bg-gray-600 flex items-center justify-center" data-index="${index}" data-delta="1">+</button>
                                <span class="ml-auto font-bold text-premium-gold">${formatarMoeda(subtotal)}</span>
                            </div>
                            <input type="text" placeholder="Observações (ex: sem cebola)" value="${escaparHTML(item.observacao)}" class="input-observacao w-full px-2 py-1 text-sm rounded bg-premium-dark border border-gray-700 text-white" data-index="${index}">
                        </div>
                    `;
                });
                container.innerHTML = html;
                atualizarResumoFinanceiro(totalItens);
                adicionarEventosCarrinho();
            }

            function adicionarEventosCarrinho() {
                const container = document.getElementById('itens-carrinho');
                container.querySelectorAll('.btn-remover-item').forEach(btn => {
                    btn.addEventListener('click', () => removerDoCarrinho(parseInt(btn.dataset.index)));
                });
                container.querySelectorAll('.btn-alterar-qtd').forEach(btn => {
                    btn.addEventListener('click', () => alterarQuantidade(parseInt(btn.dataset.index), parseInt(btn.dataset.delta)));
                });
                container.querySelectorAll('.input-observacao').forEach(input => {
                    input.addEventListener('change', () => atualizarObservacao(parseInt(input.dataset.index), input.value));
                });
            }

            function atualizarResumoFinanceiro(totalItens) {
                const tipoEntrega = document.querySelector('input[name="tipo-entrega"]:checked')?.value;
                const bairroSelect = document.getElementById('bairro');
                let taxa = 0;
                if (tipoEntrega === 'entrega') {
                    const bairroSelecionado = BAIRROS.find(b => b.nome === bairroSelect.value);
                    taxa = bairroSelecionado ? bairroSelecionado.taxa : TAXA_ENTREGA_PADRAO;
                }
                document.getElementById('taxa-entrega-valor').textContent = formatarMoeda(taxa);
                document.getElementById('tempo-estimado').textContent = tipoEntrega === 'entrega' ? TEMPO_ENTREGA : "15 a 25 minutos (retirada)";
                document.getElementById('modal-total-final').textContent = formatarMoeda(totalItens + taxa);
                
                document.getElementById('endereco').classList.toggle('hidden', tipoEntrega !== 'entrega');
                document.getElementById('bairro').classList.toggle('hidden', tipoEntrega !== 'entrega');
                document.getElementById('troco-container').classList.toggle('hidden', document.getElementById('forma-pagamento').value !== 'Dinheiro');
                
                const btnFinalizar = document.getElementById('btn-finalizar');
                const abaixoMinimo = (totalItens + taxa) < PEDIDO_MINIMO;
                btnFinalizar.disabled = abaixoMinimo || !dentroDoHorario();
                btnFinalizar.title = abaixoMinimo ? `Pedido mínimo: ${formatarMoeda(PEDIDO_MINIMO)}` : '';
            }

            function abrirCarrinho() {
                document.getElementById('modal-carrinho').classList.remove('hidden');
                document.getElementById('modal-content-carrinho').classList.add('modal-enter-active');
                renderizarItensCarrinho();
                document.getElementById('nome-cliente').focus();
            }

            function fecharCarrinho() {
                document.getElementById('modal-carrinho').classList.add('hidden');
                document.getElementById('modal-content-carrinho').classList.remove('modal-enter-active');
            }

            function abrirDetalhes(id) {
                const prod = produtos.find(p => p.id === id);
                if (!prod) return;
                produtoDetalheAtual = prod;
                document.getElementById('detalhe-img').src = prod.imagem;
                document.getElementById('detalhe-img').alt = prod.nome;
                document.getElementById('detalhe-nome').textContent = prod.nome;
                document.getElementById('detalhe-descricao').textContent = prod.descricao;
                document.getElementById('detalhe-preco').textContent = formatarMoeda(prod.preco);
                
                const opcoesDiv = document.getElementById('detalhe-opcoes');
                if (prod.extras && prod.extras.length > 0) {
                    opcoesDiv.innerHTML = prod.extras.map(extra => `
                        <div>
                            <p class="font-semibold text-sm text-gray-300 mb-1">${extra.nome}</p>
                            ${extra.tipo === 'radio' ? extra.opcoes.map((op, i) => `
                                <label class="flex items-center gap-2 mb-1"><input type="radio" name="extra-${extra.nome}" value="${op.nome}" ${i===0?'checked':''}> ${op.nome} ${op.preco > 0 ? `(+${formatarMoeda(op.preco)})` : ''}</label>
                            `).join('') : ''}
                            ${extra.tipo === 'checkbox' ? extra.opcoes.map(op => `
                                <label class="flex items-center gap-2 mb-1"><input type="checkbox" name="extra-${extra.nome}" value="${op.nome}"> ${op.nome} ${op.preco > 0 ? `(+${formatarMoeda(op.preco)})` : ''}</label>
                            `).join('') : ''}
                        </div>
                    `).join('');
                } else {
                    opcoesDiv.innerHTML = '<p class="text-sm text-gray-500">Sem opções adicionais.</p>';
                }
                
                document.getElementById('btn-adicionar-detalhe').disabled = !dentroDoHorario();
                document.getElementById('modal-detalhes').classList.remove('hidden');
                document.getElementById('modal-content-detalhes').classList.add('modal-enter-active');
            }

            function fecharDetalhes() {
                document.getElementById('modal-detalhes').classList.add('hidden');
                document.getElementById('modal-content-detalhes').classList.remove('modal-enter-active');
                produtoDetalheAtual = null;
            }

            function validarCampos() {
                let valido = true;
                const campos = [
                    document.getElementById('nome-cliente'),
                    document.getElementById('telefone-cliente'),
                    document.getElementById('endereco'),
                    document.getElementById('forma-pagamento'),
                    document.getElementById('troco')
                ];
                campos.forEach(el => el.classList.remove('invalid-field'));
                
                if (!campos[0].value.trim()) { campos[0].classList.add('invalid-field'); valido = false; }
                if (!campos[1].value.trim()) { campos[1].classList.add('invalid-field'); valido = false; }
                if (document.querySelector('input[name="tipo-entrega"]:checked').value === 'entrega' && !campos[2].value.trim()) {
                    campos[2].classList.add('invalid-field'); valido = false;
                }
                if (!campos[3].value) { campos[3].classList.add('invalid-field'); valido = false; }
                if (campos[3].value === 'Dinheiro') {
                    const totalFinal = parseFloat(document.getElementById('modal-total-final').textContent.replace(/[^\d,]/g, '').replace(',', '.'));
                    if (!campos[4].value || parseFloat(campos[4].value) < totalFinal) {
                        campos[4].classList.add('invalid-field'); valido = false;
                    }
                }
                return valido;
            }

            function finalizarPedido() {
                if (!dentroDoHorario()) {
                    mostrarToast("Estamos fechados. Volte durante o horário de funcionamento.");
                    return;
                }
                if (carrinho.length === 0) return;
                
                const totalItens = carrinho.reduce((acc, item) => acc + (item.precoUnitario * item.quantidade), 0);
                const tipoEntrega = document.querySelector('input[name="tipo-entrega"]:checked').value;
                const bairroSelecionado = BAIRROS.find(b => b.nome === document.getElementById('bairro').value);
                const taxa = (tipoEntrega === 'entrega') ? (bairroSelecionado ? bairroSelecionado.taxa : TAXA_ENTREGA_PADRAO) : 0;
                const totalFinal = totalItens + taxa;
                
                if (totalFinal < PEDIDO_MINIMO) {
                    mostrarToast(`Pedido mínimo: ${formatarMoeda(PEDIDO_MINIMO)}`);
                    return;
                }
                
                if (!validarCampos()) {
                    mostrarToast("Preencha todos os campos obrigatórios corretamente.");
                    return;
                }
                
                const nome = document.getElementById('nome-cliente').value.trim();
                const telefone = document.getElementById('telefone-cliente').value.trim();
                const endereco = tipoEntrega === 'entrega' ? document.getElementById('endereco').value.trim() : "Retirada no local";
                const formaPagamento = document.getElementById('forma-pagamento').value;
                const troco = formaPagamento === 'Dinheiro' ? document.getElementById('troco').value : '';
                const observacaoGeral = document.getElementById('observacao-geral').value.trim();
                
                let mensagem = `🍽️ *Novo Pedido - Delícia Digital*\n\n*Cliente:* ${nome}\n*Telefone:* ${telefone}\n*Tipo:* ${tipoEntrega === 'entrega' ? 'Entrega' : 'Retirada'}\n*Endereço:* ${endereco}`;
                if (tipoEntrega === 'entrega' && bairroSelecionado) mensagem += `\n*Bairro:* ${bairroSelecionado.nome} (taxa: ${formatarMoeda(bairroSelecionado.taxa)})`;
                mensagem += `\n*Pagamento:* ${formaPagamento}${troco ? ` (Troco para R$ ${troco})` : ''}`;
                if (observacaoGeral) mensagem += `\n*Obs. geral:* ${observacaoGeral}`;
                mensagem += `\n\n*Itens:*\n`;
                
                carrinho.forEach(item => {
                    mensagem += `- ${item.quantidade}x ${item.nome}`;
                    if (item.extras.length > 0) mensagem += ` [${item.extras.join(', ')}]`;
                    if (item.observacao) mensagem += ` (Obs: ${item.observacao})`;
                    mensagem += ` = ${formatarMoeda(item.precoUnitario * item.quantidade)}\n`;
                });
                
                if (taxa > 0) mensagem += `\n*Taxa de entrega:* ${formatarMoeda(taxa)}`;
                mensagem += `\n*Total:* ${formatarMoeda(totalFinal)}`;
                if (tipoEntrega === 'entrega') mensagem += `\n*Tempo estimado:* ${TEMPO_ENTREGA}`;
                
                const url = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(mensagem)}`;
                window.open(url, '_blank');
                
                mostrarConfirmacao("Pedido enviado para o WhatsApp! Deseja limpar o carrinho?", (confirmado) => {
                    if (confirmado) {
                        carrinho = [];
                        salvarCarrinho();
                        fecharCarrinho();
                    }
                });
            }

            function filtrarProdutos() {
                const termo = document.getElementById('busca').value.toLowerCase();
                const filtrados = produtos.filter(p => 
                    (categoriaAtiva === "Todas" || p.categoria === categoriaAtiva) &&
                    (p.nome.toLowerCase().includes(termo) || p.descricao.toLowerCase().includes(termo))
                );
                renderizarProdutos(filtrados);
            }

            function filtrarPorCategoria(categoria) {
                categoriaAtiva = categoria;
                document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.toggle('active', btn.textContent === categoria));
                filtrarProdutos();
            }

            function renderizarProdutos(lista) {
                const container = document.getElementById('produtos-container');
                if (lista.length === 0) {
                    container.innerHTML = '<div class="col-span-full text-center py-10 text-gray-500">Nenhum prato encontrado.</div>';
                    return;
                }
                const horarioFuncionando = dentroDoHorario();
                container.innerHTML = lista.map(prod => `
                    <article class="bg-premium-gray rounded-2xl overflow-hidden border border-gray-800 flex flex-col transition-transform hover:scale-[1.02]">
                        <img src="${prod.imagem}" alt="${escaparHTML(prod.nome)}" class="h-40 w-full object-cover cursor-pointer btn-detalhes-produto" data-id="${prod.id}" loading="lazy">
                        <div class="p-5 flex flex-col flex-grow">
                            <h2 class="text-xl font-serif text-premium-gold">${escaparHTML(prod.nome)}</h2>
                            <p class="text-gray-400 text-sm mb-4">${escaparHTML(prod.descricao.substring(0, 60))}...</p>
                            <button class="btn-adicionar-rapido mt-auto w-full py-3 rounded-lg border border-premium-gold text-premium-gold hover:bg-premium-gold hover:text-premium-dark font-bold transition disabled:opacity-50 disabled:cursor-not-allowed" data-id="${prod.id}" ${!horarioFuncionando ? 'disabled' : ''}>
                                ${horarioFuncionando ? `Adicionar (${formatarMoeda(prod.preco)})` : 'Fechado'}
                            </button>
                        </div>
                    </article>
                `).join('');
                container.querySelectorAll('.btn-detalhes-produto').forEach(img => {
                    img.addEventListener('click', () => abrirDetalhes(parseInt(img.dataset.id)));
                });
                container.querySelectorAll('.btn-adicionar-rapido').forEach(btn => {
                    btn.addEventListener('click', () => adicionarRapido(parseInt(btn.dataset.id)));
                });
            }

            function adicionarRapido(id) {
                const prod = produtos.find(p => p.id === id);
                if (prod) adicionarAoCarrinho(prod, [], 0);
            }

            function adicionarDoDetalhe() {
                if (!produtoDetalheAtual) return;
                let precoAdicional = 0;
                const nomesExtras = [];
                if (produtoDetalheAtual.extras) {
                    produtoDetalheAtual.extras.forEach(extra => {
                        if (extra.tipo === 'radio') {
                            const selecionado = document.querySelector(`input[name="extra-${extra.nome}"]:checked`);
                            if (selecionado) {
                                const opcao = extra.opcoes.find(op => op.nome === selecionado.value);
                                if (opcao) { nomesExtras.push(opcao.nome); precoAdicional += opcao.preco; }
                            }
                        } else if (extra.tipo === 'checkbox') {
                            document.querySelectorAll(`input[name="extra-${extra.nome}"]:checked`).forEach(chk => {
                                const opcao = extra.opcoes.find(op => op.nome === chk.value);
                                if (opcao) { nomesExtras.push(opcao.nome); precoAdicional += opcao.preco; }
                            });
                        }
                    });
                }
                adicionarAoCarrinho(produtoDetalheAtual, nomesExtras, precoAdicional);
                fecharDetalhes();
            }

            function verificarMudancaHorario() {
                const statusAtual = dentroDoHorario();
                if (horarioAnterior !== null && horarioAnterior !== statusAtual) {
                    atualizarBannerHorario();
                    filtrarProdutos();
                    if (!document.getElementById('modal-carrinho').classList.contains('hidden')) renderizarItensCarrinho();
                }
                horarioAnterior = statusAtual;
            }

            function atualizarBannerHorario() {
                document.getElementById('horario-banner').classList.toggle('hidden', dentroDoHorario());
            }

            function inicializarFiltros() {
                const categorias = ['Todas', ...new Set(produtos.map(p => p.categoria))];
                const container = document.getElementById('filtros-container');
                container.innerHTML = categorias.map(cat => `
                    <button class="filter-btn px-4 py-1.5 rounded-full text-sm font-semibold border border-premium-gold text-premium-gold hover:bg-premium-gold hover:text-premium-dark transition ${cat === 'Todas' ? 'active' : ''}">${cat}</button>
                `).join('');
                container.querySelectorAll('.filter-btn').forEach(btn => {
                    btn.addEventListener('click', () => filtrarPorCategoria(btn.textContent));
                });
            }

            function inicializarBairros() {
                const select = document.getElementById('bairro');
                select.innerHTML = '<option value="">Selecione o bairro</option>' +
                    BAIRROS.map(b => `<option value="${b.nome}">${b.nome} (${formatarMoeda(b.taxa)})</option>`).join('');
            }

            function configurarEventos() {
                document.getElementById('btn-carrinho-mobile').addEventListener('click', abrirCarrinho);
                document.getElementById('btn-carrinho-desktop').addEventListener('click', abrirCarrinho);
                document.getElementById('btn-abrir-carrinho-footer').addEventListener('click', abrirCarrinho);
                document.getElementById('btn-fechar-carrinho').addEventListener('click', fecharCarrinho);
                document.getElementById('btn-fechar-detalhes').addEventListener('click', fecharDetalhes);
                document.getElementById('btn-adicionar-detalhe').addEventListener('click', adicionarDoDetalhe);
                document.getElementById('btn-finalizar').addEventListener('click', finalizarPedido);
                document.getElementById('btn-esvaziar-carrinho').addEventListener('click', esvaziarCarrinho);
                document.getElementById('busca').addEventListener('input', filtrarProdutos);
                document.getElementById('forma-pagamento').addEventListener('change', () => {
                    const totalItens = carrinho.reduce((acc, item) => acc + (item.precoUnitario * item.quantidade), 0);
                    atualizarResumoFinanceiro(totalItens);
                });
                document.querySelectorAll('input[name="tipo-entrega"]').forEach(radio => {
                    radio.addEventListener('change', () => {
                        const totalItens = carrinho.reduce((acc, item) => acc + (item.precoUnitario * item.quantidade), 0);
                        atualizarResumoFinanceiro(totalItens);
                    });
                });
                document.getElementById('bairro').addEventListener('change', () => {
                    const totalItens = carrinho.reduce((acc, item) => acc + (item.precoUnitario * item.quantidade), 0);
                    atualizarResumoFinanceiro(totalItens);
                });
                document.getElementById('modal-carrinho').addEventListener('click', function(e) {
                    if (e.target === this) fecharCarrinho();
                });
                document.getElementById('modal-detalhes').addEventListener('click', function(e) {
                    if (e.target === this) fecharDetalhes();
                });
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape') {
                        if (!document.getElementById('modal-detalhes').classList.contains('hidden')) fecharDetalhes();
                        if (!document.getElementById('modal-carrinho').classList.contains('hidden')) fecharCarrinho();
                    }
                });
            }

            function mostrarToast(mensagem) {
                const toast = document.getElementById('toast');
                toast.textContent = mensagem;
                toast.classList.add('toast');
                toast.style.opacity = '1';
                setTimeout(() => {
                    toast.style.opacity = '0';
                    toast.classList.remove('toast');
                }, 3000);
            }

            window.addEventListener('DOMContentLoaded', () => {
                carregarCarrinho();
                inicializarFiltros();
                inicializarBairros();
                configurarEventos();
                renderizarProdutos(produtos);
                atualizarInterface();
                atualizarBannerHorario();
                horarioAnterior = dentroDoHorario();
                setInterval(verificarMudancaHorario, 30000);
            });
        })();
    </script>
</body>
                        </html>
